<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ASAA Travel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center py-10 px-4">

    <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-lg border border-gray-200">
        <div class="text-center mb-6">
            <i class="fa-solid fa-user-lock text-4xl text-blue-600 mb-2"></i>
            <h2 class="text-2xl font-bold text-gray-800">Login</h2>
            <p class="text-gray-500 text-sm">Log in to apply for travel tickets</p>
        </div>

        <!-- Same form for everyone. The backend checks admin credentials first,
             then customer accounts, and tells us which one matched. -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="text" id="loginEmail" required placeholder="traveler@example.com" class="mt-1 w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••" class="mt-1 w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200">
                Log In
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            Don't have an account? <a href="/register" class="text-blue-600 font-semibold hover:underline">Register here</a>
        </div>
        <div class="mt-2 text-center text-xs text-gray-400">
            Demo customer login: traveler@example.com / user123
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    if (data.role === 'admin') {
                        localStorage.setItem('asaa_admin_token', 'logged_in');
                        alert("Admin authentication successful!");
                        window.location.href = "/admin";
                    } else {
                        localStorage.setItem('asaa_customer_user', JSON.stringify(data.user));
                        alert("Login successful! Redirecting to ticket application...");
                        window.location.href = "/";
                    }
                } else {
                    alert("Error: " + data.error);
                }
            });
        }
    </script>
</body>
</html>
